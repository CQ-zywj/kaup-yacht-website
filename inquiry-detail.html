<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="演示线索已下线，真实需求请前往 RFQ 市场" />
    <title>NORTHLINK | Global B2B sourcing</title>

  <body data-page="inquiry-detail">
    <a class="skip-link" href="#main">跳至主要内容 / Skip to content</a>
    <main id="main" tabindex="-1">
      <div class="container section">
        <p>演示线索已下线，平台上的采购需求现在都来自真实发布的公开 RFQ。正在跳转…</p>
        <p><a class="text-link" href="index.html" data-fallback>前往首页 →</a></p>
      </div>
    </main>
    <script>
      /* 首页那 3 条"演示采购线索"是原型期为了让首页不空而写的假数据：
         买家不存在、点"联系"什么也不发生。真实商机走 rfq-market / my-rfq 闭环，
         所以这块内容连同详情页一起下线，旧链接跳到首页，不做二次跳转。 */
      (function () {
        var lang = new URLSearchParams(location.search).get("lang") || "";
        var target = "index.html" + (lang ? "?lang=" + encodeURIComponent(lang) : "");
        var fallback = document.querySelector("[data-fallback]");
        if (fallback) fallback.href = target;
        location.replace(target);
      })();
    </script>
  </body>
</html>
